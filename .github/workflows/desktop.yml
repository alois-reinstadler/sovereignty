name: Desktop development

on:
  push:
    branches: [main, "agent/sovereignty-native-ci"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf webkit2gtk-driver xvfb openbox xdotool
      - name: Inspect Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Compile development client without signing or bundling
        run: pnpm --filter @svrgn/desktop exec tauri build --debug --no-bundle --no-sign --ci -- --locked
      - name: Test native code
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Install pinned native WebDriver bridge
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Exercise compiled Linux vault in WebKit
        if: runner.os == 'Linux'
        run: xvfb-run -a node apps/desktop/e2e/native-vault.mjs
      - name: Preserve native UI test evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-ui-evidence
          path: apps/desktop/e2e/artifacts/
          if-no-files-found: warn
          retention-days: 3
      # This captures dependency metadata only, never application binaries.
      - name: Preserve resolved Rust lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-lock-${{ matrix.os }}
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 3
