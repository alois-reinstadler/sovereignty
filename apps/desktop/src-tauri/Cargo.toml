[package]
name = "svrgn-desktop"
version = "0.1.0"
description = "The self-hostable Sovereignty password manager desktop application"
authors = ["Sovereignty contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "svrgn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
