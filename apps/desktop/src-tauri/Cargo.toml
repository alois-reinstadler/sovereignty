[package]
name = "svrgn-desktop"
version = "0.1.0"
description = "The self-hostable SVRGN password manager desktop application"
authors = ["SVRGN contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "svrgn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
